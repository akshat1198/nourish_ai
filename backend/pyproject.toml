[tool.poetry]
name = "fridgpt"
version = "0.1.0"
description = "AI-powered recipe recommendation system"
authors = ["akshat1198"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
pydantic = "^2.0"
python-dotenv = "^1.0.0"
openai = "^0.27.0"
redis = "^4.5.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
scikit-learn = "^1.0.2"
sentence-transformers = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.0"
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3
